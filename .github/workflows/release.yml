# Pushing a v* tag builds binaries for Windows, macOS and Linux and attaches
# them, with checksums, to a GitHub release.
#
# The release notes are the tag's own message. They were meant to be written on
# GitHub afterwards and never were, so every release page through v0.5.3 was
# blank while the notes sat in the annotated tag where only `git show` finds
# them. One source, written when the tag is cut.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: go.mod
      - name: tests before publishing anything
        run: make check
      # Written outside the checkout: GoReleaser refuses to publish from a
      # dirty tree, and an untracked file in the repo counts as dirty.
      - name: release notes from the tag message
        run: |
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            git cat-file -p "$GITHUB_REF_NAME" | sed '1,/^$/d' > "$RUNNER_TEMP/notes.md"
          fi

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: attest release artifacts
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
