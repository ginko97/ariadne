# Every push and pull request: the same gate as `make check`, on the three
# operating systems ariadne ships for. No live API calls — the `live` build
# tag keeps those out of the default test run, and audit-livetests enforces it.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: make check
        if: runner.os != 'Windows'
        run: make check

      - name: race detector
        if: runner.os != 'Windows'
        run: go test -race -count=1 -v ./...

      - name: vulnerability check
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # Windows runners are not guaranteed a GNU make, so the checks that
      # make runs are spelled out. The race detector needs cgo there, so it
      # runs on the other two. Three audits in make check are not repeated
      # here on purpose: audit-tracked, audit-livetests and audit-docnames
      # read the repository's files, which are identical on every OS, and
      # they run on Linux and macOS. audit-skips does depend on the OS (which
      # tests skip where), so it runs here too.
      - name: check (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go vet -tags live ./...
          go test -count=1 ./...
          go run ./scripts/audit-skips.go
