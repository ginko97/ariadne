# One static binary per platform, no cgo, stamped with the tag as its version.
version: 2

builds:
  - id: ariadne
    main: ./cmd/ariadne
    binary: ariadne
    env:
      - CGO_ENABLED=0
    goos: [windows, linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Tag }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "ariadne_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

# No changelog block, deliberately. The workflow passes the annotated tag's
# message with --release-notes, and GoReleaser reads that file inside the
# changelog pipe's Run — which never executes when changelog.disable is true,
# because Skip() returns first. That setting silently threw the notes away:
# v0.5.0 through v0.6.1 each published a 1.5-2 KB tag message as an empty
# release page. With a notes file present, Run returns before generating a
# changelog from commit subjects, so leaving the pipe enabled produces the tag
# message and nothing else. scripts/goreleaser_test.go keeps it that way.

release:
  draft: false
  prerelease: auto
