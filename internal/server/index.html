<!doctype html>
<meta charset="utf-8">
<title>ariadne</title>
<meta name="csrf" content="{{.CSRF}}">
<style>
  :root { color-scheme: light dark; --edge:#8883; --dim:#8888; --err:#c33; }
  * { box-sizing: border-box; }
  /* Painted, not inherited: a browser that draws its own default behind an
     unpainted page (dark, in some embedded views) would show through. The
     system colours follow color-scheme, so the theme button still decides. */
  body { margin:0; height:100vh; display:grid; grid-template-columns:17rem 1fr;
         background:Canvas; color:CanvasText;
         font:14px/1.55 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif; }
  aside { border-right:1px solid var(--edge); display:flex; flex-direction:column; min-height:0; }
  aside header { padding:.7rem .9rem; border-bottom:1px solid var(--edge); display:flex; gap:.5rem; }
  #theme, #settings { font:inherit; cursor:pointer; width:2.4rem; }
  #setup { border-bottom:1px solid var(--edge); padding:.9rem; display:flex; flex-direction:column;
           gap:.55rem; max-width:40rem; }
  #setup h2 { margin:0; font-size:1.05em; }
  #setup label { display:flex; flex-direction:column; gap:.2rem; font-size:.9em; }
  #setup input, #setup select { font:inherit; padding:.35rem .5rem; }
  #setup .row { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; }
  #setup button { font:inherit; cursor:pointer; padding:.35rem .9rem; }
  #runs { overflow-y:auto; flex:1; }
  #runs button { display:block; width:100%; text-align:left; background:none; border:0;
                 border-bottom:1px solid var(--edge); padding:.6rem .9rem; cursor:pointer;
                 font:inherit; color:inherit; }
  #runs button:hover { background:#8881; }
  #runs button[aria-current="true"] { background:#8882; font-weight:600; }
  #runs .meta, .dim { color:var(--dim); font-size:.8em; font-weight:400; }
  #runs .title { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  main { display:flex; flex-direction:column; min-height:0; min-width:0; }
  #bar { padding:.55rem .9rem; border-bottom:1px solid var(--edge); display:flex;
         gap:.6rem; align-items:center; }
  #bar select { max-width:22rem; font:inherit; }
  #folder { max-width:28rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #bar button { font:inherit; cursor:pointer; }
  #folderPanel { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap;
                 padding:.5rem .9rem; border-bottom:1px solid var(--edge); }
  #folderPanel input { flex:1; min-width:14rem; font:inherit; padding:.35rem .5rem; }
  #folderPanel button { font:inherit; cursor:pointer; }
  #log { flex:1; overflow-y:auto; padding:1rem; display:flex; flex-direction:column; gap:.7rem; }
  .e { max-width:52rem; white-space:pre-wrap; overflow-wrap:anywhere; }
  .prompt { align-self:flex-end; background:#8882; padding:.5rem .75rem; border-radius:.6rem; }
  .tool_call, .tool_result { color:var(--dim); font-family:ui-monospace,SFMono-Regular,monospace;
                             font-size:.82em; border-left:2px solid var(--edge); padding-left:.6rem; }
  .notice { color:var(--dim); font-size:.85em; border-left:2px dashed var(--edge); padding-left:.6rem; }
  .is_error { color:var(--err); border-left-color:var(--err); }
  .approval { border:1px solid var(--edge); border-left:3px solid #d90; border-radius:.4rem;
              padding:.6rem .75rem; display:flex; flex-direction:column; gap:.5rem;
              max-width:52rem; }
  .approval code { font-family:ui-monospace,SFMono-Regular,monospace; font-size:.85em;
                   overflow-wrap:anywhere; }
  .approval .row { display:flex; gap:.5rem; align-items:center; }
  .approval button { font:inherit; padding:.3rem .9rem; cursor:pointer; }
  .approval.settled { border-left-color:var(--edge); color:var(--dim); }
  form { display:flex; gap:.5rem; padding:.75rem .9rem; border-top:1px solid var(--edge); }
  textarea { flex:1; resize:none; font:inherit; padding:.5rem; min-height:2.6rem; max-height:11rem; }
  button.primary { font:inherit; padding:.5rem 1.1rem; cursor:pointer; }
  #warn { padding:.4rem .9rem; background:#fd42; font-size:.85em; }
  #working { padding:.35rem .9rem; color:var(--dim); font-size:.85em; display:flex; gap:.5rem;
             align-items:center; border-top:1px solid var(--edge); }
  #working .spin { width:.8rem; height:.8rem; border:2px solid var(--edge); border-top-color:currentColor;
                   border-radius:50%; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #working .spin { animation:none; } }
  [hidden] { display:none !important; }
</style>

<aside>
  <header>
    <button class="primary" id="new" style="flex:1">New conversation</button>
    <button type="button" id="settings" title="Provider, key and model">⚙</button>
    <button type="button" id="theme" title="Theme: follow the system, light, or dark"></button>
  </header>
  <div id="runs"></div>
</aside>

<main>
  <div id="bar">
    <select id="model" title="Model for the next turn"></select>
    <span id="stats" class="dim"></span>
    <span id="folder" class="dim" title="The folder this conversation can read and write"></span>
    <button type="button" id="folderBtn" title="Choose the folder for this new conversation">Folder…</button>
  </div>
  <div id="folderPanel" hidden>
    <input id="folderInput" type="text" spellcheck="false" placeholder="Full path of a folder">
    <button type="button" id="browse" hidden>Browse…</button>
    <button type="button" id="useFolder" class="primary">Use</button>
    <button type="button" id="cancelFolder">Cancel</button>
    <span id="folderErr" class="is_error"></span>
  </div>
  <form id="setup" hidden autocomplete="off">
    <h2 id="setupTitle">Choose a model provider</h2>
    <div id="setupStatus" class="dim"></div>
    <label>Provider <select id="setupProvider"></select></label>
    <label id="setupURLRow" hidden>Endpoint URL
      <input id="setupURL" type="url" spellcheck="false" placeholder="https://…/v1"></label>
    <label id="setupKeyRow">Key <span id="setupKeyName" class="dim"></span>
      <input id="setupKey" type="password" spellcheck="false" autocomplete="off"></label>
    <label>Model
      <input id="setupModel" type="text" spellcheck="false" list="setupModels"></label>
    <datalist id="setupModels"></datalist>
    <div class="row">
      <button type="submit" id="setupSave" class="primary">Check and save</button>
      <button type="button" id="setupCancel">Cancel</button>
      <span id="setupErr" class="is_error"></span>
    </div>
    <div class="dim">The key is checked with one small request to that provider, saved in
      config.env on this computer, and never shown again, here or anywhere else.</div>
  </form>
  <div id="warn" hidden></div>
  <div id="log"></div>
  <div id="working" hidden><span class="spin"></span><span id="workingWhat" role="status"></span><span id="workingTime" aria-hidden="true"></span></div>
  <form id="composer">
    <textarea id="input" rows="1" placeholder="Ask something…  (Enter to send, Shift+Enter for a newline)"></textarea>
    <button class="primary" id="send">Send</button>
    <button type="button" id="stop" hidden title="Stop this turn. What already ran stays done.">Stop</button>
  </form>
</main>

<script>
const CSRF = document.querySelector('meta[name=csrf]').content;
const $ = id => document.getElementById(id);
const log = $('log'), runsEl = $('runs'), modelEl = $('model'), statsEl = $('stats');
let runID = null, busy = false;
// The folder a new conversation will use (null: the server's default), the
// server's default, and the folder of the conversation that is open. A
// conversation's folder is fixed when it starts, so the button to change it
// only exists before the first message.
let newWorkspace = null, defaultWorkspace = '', convWorkspace = '';
const pendingApprovals = new Map();
// The request of the turn that is running, so Stop can abort it. Aborting is
// the whole mechanism: the server runs the turn on the request's context, and
// net/http cancels that when the connection closes (TestAbortingTheRequest-
// StopsTheTurn). What already ran is checkpointed; a tool call waiting for
// approval stays pending, to be asked again on Resume.
let turn = null;

// Theme: follow the system, or force light or dark. Every colour here is a
// translucent grey over the browser's own canvas, so setting color-scheme on
// the root is the whole switch. Remembered in this browser only; storage can
// be unavailable (a private window), and then the choice lasts the page.
const THEMES = { auto: ['light dark', 'Theme: system'], light: ['light', 'Theme: light'], dark: ['dark', 'Theme: dark'] };
const THEME_ICON = { auto: '◐', light: '☀', dark: '☾' };
function setTheme(name) {
  if (!THEMES[name]) name = 'auto';
  document.documentElement.style.colorScheme = THEMES[name][0];
  $('theme').textContent = THEME_ICON[name];
  $('theme').title = THEMES[name][1] + ' (click to change)';
  $('theme').dataset.theme = name;
  try { localStorage.setItem('ariadne.theme', name); } catch {}
}
{
  let saved = 'auto';
  try { saved = localStorage.getItem('ariadne.theme') || 'auto'; } catch {}
  setTheme(saved);
}
$('theme').onclick = () => {
  const order = ['auto', 'light', 'dark'];
  setTheme(order[(order.indexOf($('theme').dataset.theme) + 1) % order.length]);
};

const api = (path, opts = {}) => fetch(path, {
  ...opts,
  headers: { 'Content-Type': 'application/json', 'X-Ariadne-CSRF': CSRF, ...(opts.headers || {}) },
});

function warn(msg) {
  const el = $('warn');
  el.textContent = msg || '';
  el.hidden = !msg;
}

// Entries are appended as elements rather than re-rendered from a model. A
// streaming answer grows one text node while the rest of the transcript stays
// untouched, and scroll position survives.
function entry(kind, text, cls) {
  const el = document.createElement('div');
  el.className = 'e ' + kind + (cls ? ' ' + cls : '');
  el.textContent = text;
  log.append(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

// Selecting a model the list does not contain silently clears the picker:
// assigning an unknown value to a <select> leaves it blank. That happens
// whenever a conversation ran on a model the current list is missing — an
// older model, or a fallback list holding only the configured one — and a
// blank picker cannot say what the next turn will use. The model is real
// either way, since a conversation ran on it, so it is added rather than lost.
function selectModel(id) {
  if (!id) return;
  if (![...modelEl.options].some(o => o.value === id)) {
    const o = document.createElement('option');
    o.value = id;
    o.textContent = id;
    modelEl.prepend(o);
  }
  modelEl.value = id;
}


// A gated tool asks here and waits. Nothing but an explicit yes runs the tool:
// a five-minute silence is a denial, and a closed tab leaves the call pending
// to be asked again — so this only has to carry an answer, never to enforce one.
function approvalCard(d) {
  const el = document.createElement('div');
  el.className = 'e approval';

  const q = document.createElement('div');
  q.textContent = `Allow ${d.tool}?`;
  const args = document.createElement('code');
  args.textContent = d.args || '';

  const row = document.createElement('div');
  row.className = 'row';
  const yes = document.createElement('button');
  yes.textContent = 'Approve';
  const no = document.createElement('button');
  no.textContent = 'Deny';
  const note = document.createElement('span');
  note.className = 'dim';

  async function answer(approve) {
    yes.disabled = no.disabled = true;
    if (busy) working(approve ? 'running ' + d.tool : 'thinking');
    try {
      const resp = await api('/api/approve', {
        method: 'POST',
        body: JSON.stringify({ run_id: d.run_id, call_id: d.call_id, approve }),
      });
      if (!resp.ok) {
        // 410 is the usual one: the turn stopped waiting before this got sent.
        // The question is over either way, so the card settles rather than
        // offering buttons for an answer nothing will read.
        const { error } = await resp.json().catch(() => ({ error: 'refused' }));
        note.textContent = error;
        el.classList.add('settled');
        pendingApprovals.delete(d.call_id);
        return;
      }
      note.textContent = approve ? 'approved' : 'denied';
      el.classList.add('settled');
      pendingApprovals.delete(d.call_id);
    } catch (e) {
      note.textContent = 'could not send: ' + e.message;
      yes.disabled = no.disabled = false;
    }
  }
  yes.onclick = () => answer(true);
  no.onclick = () => answer(false);

  row.append(yes, no, note);
  el.append(q, args, row);
  log.append(el);
  log.scrollTop = log.scrollHeight;
  // Held so a timeout can settle the card rather than leaving two live buttons
  // for a question the server has already stopped waiting on.
  pendingApprovals.set(d.call_id, { el, note, yes, no });
}

function render(entries) {
  log.replaceChildren();
  for (const e of entries) {
    if (e.kind === 'tool_call') entry('tool_call', `→ ${e.tool}(${e.args || ''})`);
    else if (e.kind === 'tool_result') entry('tool_result', `← ${e.text}`, e.is_error ? 'is_error' : '');
    else entry(e.kind, e.text);
  }
}

async function loadRuns() {
  try {
    const { runs } = await (await api('/api/runs?limit=100')).json();
    runsEl.replaceChildren();
    for (const r of runs) {
      const b = document.createElement('button');
      b.innerHTML = '<span class="title"></span><span class="meta"></span>';
      b.querySelector('.title').textContent = r.title || '(untitled)';
      b.querySelector('.meta').textContent =
        `${r.turns} turn${r.turns === 1 ? '' : 's'} · ${r.model || ''}`;
      if (r.run_id === runID) b.setAttribute('aria-current', 'true');
      b.onclick = () => open(r.run_id);
      runsEl.append(b);
    }
  } catch (e) { warn('Could not list conversations: ' + e.message); }
}

async function open(id) {
  if (busy) return;
  const resp = await api('/api/runs/' + id);
  if (!resp.ok) { warn('Could not open that conversation.'); return; }
  const t = await resp.json();
  runID = t.run_id;
  convWorkspace = t.workspace || '';
  closeFolderPanel();
  showFolder();
  render(t.messages);
  stats(t.turns, t.steps, t.cost_usd, t.cost_unknown);
  selectModel(t.model);
  if (t.pending) {
    showResumeCard();
  }
  loadRuns();
}

function stats(turns, steps, cost, unknown) {
  // Unknown, free and tiny must not look alike. A provider that does not price
  // its own calls reports nothing, which is "unknown" rather than "free", and
  // the server says so; a total missing some steps is a lower bound. A real
  // cost below the rounding floor is not free either — two steps on a cheap
  // model come to about $0.00002 — and printing $0.0000 for it is the exact
  // string this distinction exists to avoid.
  const money = unknown
    ? (cost > 0 ? ` · ≥$${cost < 0.0001 ? cost.toPrecision(1) : cost.toFixed(4)}` : ' · cost unknown')
    : cost > 0
      ? (cost < 0.0001 ? ' · <$0.0001' : ` · $${cost.toFixed(4)}`)
      : '';
  statsEl.textContent = runID
    ? `${turns} turn${turns === 1 ? '' : 's'} · ${steps} step${steps === 1 ? '' : 's'}${money}`
    : '';
}

function newConversation() {
  if (busy) return;
  runID = null;
  newWorkspace = null;
  convWorkspace = '';
  closeFolderPanel();
  showFolder();
  log.replaceChildren();
  statsEl.textContent = '';
  warn('');
  for (const b of runsEl.children) b.removeAttribute('aria-current');
  $('input').focus();
}

async function loadModels(reset) {
  try {
    const d = await (await api('/api/models')).json();
    // What is selected now outranks the default. The list is fetched without
    // being awaited and can take ten seconds, so a conversation opened in the
    // meantime has already set the picker to its own model — and rebuilding the
    // options would drop that on the floor and silently revert to the configured
    // one. The next message would then carry a model the person did not choose,
    // switching the conversation underneath them. That is the same defect
    // f6854cf fixed on the server, arriving from the client instead.
    // After a provider change the old choice belongs to the old endpoint.
    const chosen = reset ? '' : modelEl.value;
    modelEl.replaceChildren();
    for (const m of d.models) {
      const o = document.createElement('option');
      o.value = m.id;
      // Price is shown but the list is not sorted by it. The cheapest
      // tool-capable model on this gateway scored 3/6 in this project's own
      // evals precisely because it answers from its weights instead of calling
      // the tool — a price-ordered picker would lead straight to it.
      const price = m.prompt_per_mtok > 0 ? `  $${m.prompt_per_mtok.toFixed(2)}/Mtok` : '';
      o.textContent = m.id + price;
      modelEl.append(o);
    }
    // The server's configured model, not whatever sorts first. Alphabetical
    // order is not a ranking, and letting it decide means the opening turn of
    // every conversation runs on a model nobody picked. Only when nothing was
    // chosen yet, per the note above.
    selectModel(chosen || d.configured);
    if (d.warning) warn(d.warning);
  } catch (e) { warn('Could not load the model list: ' + e.message); }
}

// The status line while a turn runs. A model can think for a minute before
// the first word, and a page that shows nothing in that time looks stopped:
// this says it is working, for how long, and on what — the last thing the
// stream reported. It is the stream's account, not a progress bar: nobody
// knows how long a model will take.
let workingSince = 0, workingWhat = '', workingTimer = null;
// The activity is announced to screen readers when it changes; the clock is
// not, or it would be read out every second.
function working(what) {
  workingWhat = what;
  $('workingWhat').textContent = 'Working… ' + what;
  showWorking();
}
function showWorking() {
  const s = Math.floor((Date.now() - workingSince) / 1000);
  $('workingTime').textContent = s < 60 ? s + 's' : Math.floor(s / 60) + 'm ' + (s % 60) + 's';
}

function setBusy(val) {
  busy = val;
  $('working').hidden = !val;
  clearInterval(workingTimer);
  if (val) {
    workingSince = Date.now();
    working('thinking');
    workingTimer = setInterval(showWorking, 1000);
  }
  $('send').disabled = val;
  $('send').hidden = val;
  $('stop').hidden = !val;
  $('new').disabled = val;
  $('folderBtn').disabled = val;
}

function showResumeCard() {
  const existing = $('resumeCard');
  if (existing) existing.remove();

  const el = document.createElement('div');
  el.id = 'resumeCard';
  el.className = 'e approval';

  const q = document.createElement('div');
  q.textContent = 'This conversation has an unfinished tool call from an interrupted turn.';

  const row = document.createElement('div');
  row.className = 'row';

  const btn = document.createElement('button');
  btn.className = 'primary';
  btn.textContent = 'Resume turn';
  btn.onclick = () => {
    el.remove();
    send('', { resume: true });
  };

  row.append(btn);
  el.append(q, row);
  log.append(el);
  log.scrollTop = log.scrollHeight;
}

// EventSource cannot be used here: it only issues GET and cannot set headers,
// and /api/chat is a POST behind a CSRF token because it spends money. So the
// stream is read from the response body and framed by hand.
async function send(text, opts = {}) {
  if (busy) return;
  setBusy(true);
  warn('');
  if (opts.resume) {
    entry('notice', 'Resuming interrupted turn…');
  } else {
    entry('prompt', text);
  }

  let answer = null, resp, stopped = false;
  turn = new AbortController();
  try {
    resp = await api('/api/chat', {
      method: 'POST',
      signal: turn.signal,
      // No model on resume: the server finishes the batch on the model that
      // started it, and refuses another — so a dropdown changed in the
      // meantime would only turn Resume into an error.
      body: JSON.stringify(opts.resume ? {
        run_id: runID, resume: true,
      } : {
        run_id: runID, message: text, model: modelEl.value || undefined,
        workspace: runID ? undefined : (newWorkspace || undefined),
      }),
    });
  } catch (e) {
    if (e.name === 'AbortError') {
      entry('notice', 'Stopped before the turn started.');
    } else {
      entry('tool_result', 'Could not reach ariadne: ' + e.message, 'is_error');
    }
    turn = null;
    setBusy(false);
    return;
  }

  if (!resp.ok) {
    const { error } = await resp.json().catch(() => ({ error: 'request refused' }));
    entry('tool_result', error, 'is_error');
    if (resp.status === 409 && (error || '').includes('unfinished tool call')) {
      // The input was cleared when this was sent; put it back so resuming
      // does not cost the person what they had just typed.
      if (!opts.resume && text) $('input').value = text;
      showResumeCard();
    }
    setBusy(false);
    return;
  }

  const reader = resp.body.getReader(), dec = new TextDecoder();
  let buf = '';
  try {
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      // Events are separated by a blank line; a partial one stays in the buffer
      // until the rest of it arrives.
      let i;
      while ((i = buf.indexOf('\n\n')) !== -1) {
        const block = buf.slice(0, i); buf = buf.slice(i + 2);
        let name = '', data = '';
        for (const line of block.split('\n')) {
          if (line.startsWith('event: ')) name = line.slice(7);
          else if (line.startsWith('data: ')) data = line.slice(6);
        }
        if (!name) continue;
        let d = {};
        try { d = JSON.parse(data); } catch {}

        if (name === 'start') {
          if (!runID) convWorkspace = newWorkspace || defaultWorkspace;
          runID = d.run_id;
          closeFolderPanel();
          showFolder();
        }
        else if (name === 'tool') {
          entry('tool_call', '→ ' + d.name);
          working('calling ' + d.name);
          answer = null;
        } else if (name === 'token') {
          if (!answer) { answer = entry('answer', ''); working('writing the answer'); }
          answer.textContent += d.text;
          log.scrollTop = log.scrollHeight;
        } else if (name === 'done') {
          // The streamed text and the final answer are the same words; replace
          // rather than append, so a provider that does not stream still shows one.
          if (!answer) answer = entry('answer', '');
          answer.textContent = d.answer;
          stats(d.turns, d.steps, d.cost, d.cost_unknown);
          selectModel(d.model);
        } else if (name === 'approval_required') {
          approvalCard(d);
          working('waiting for your approval');
          answer = null;
        } else if (name === 'approval_timeout') {
          const p = pendingApprovals.get(d.call_id);
          if (p) {
            p.yes.disabled = p.no.disabled = true;
            p.note.textContent = 'timed out — denied';
            p.el.classList.add('settled');
            pendingApprovals.delete(d.call_id);
          }
        } else if (name === 'error') {
          entry('tool_result', d.error, 'is_error');
          answer = null;
        }
      }
    }
  } catch (e) {
    if (e.name === 'AbortError') {
      stopped = true;
    } else {
      entry('tool_result', 'Stream interrupted: ' + e.message, 'is_error');
    }
  } finally {
    turn = null;
    setBusy(false);
    loadRuns();
  }
  // Show what the conversation really holds now, not what had streamed: a
  // partial answer was never saved, and a tool call stopped at its approval is
  // pending — reopening renders the Resume card for it.
  if (stopped && runID) {
    await open(runID);
    entry('notice', 'Stopped. Anything that already ran is kept.');
  } else if (stopped) {
    entry('notice', 'Stopped.');
  }
}

$('composer').onsubmit = e => {
  e.preventDefault();
  if (busy) return;
  const t = $('input').value.trim();
  if (!t) return;
  $('input').value = '';
  // "//" sends a message that starts with a slash; one "/" is a command for
  // the page, answered here, never sent to the model.
  if (t.startsWith('//')) { send(t.slice(1)); return; }
  if (t.startsWith('/')) { command(t); return; }
  send(t);
};

// ---------------------------------------------------------------- commands
//
// Before these, "/help" went to the model as a message: it cost a model call
// ($0.026 on one model) and the answer was the model's own account of the app,
// right only as far as the model guessed it. These are the page's, and free.
const HELP = `Commands (answered by this page, never sent to the model):
  /help               this list
  /new                start a new conversation
  /settings           provider, key and model
  /model [id]         show the model for the next message, or switch to id
  /folder             the folder this conversation reads and writes
  /theme [system|light|dark]
  /stop               stop the turn that is running
  //text              send a message that starts with a slash

What ariadne can do, through its tools:
  calc        exact arithmetic
  fetch       read a file: text, Word, Excel, PowerPoint, LibreOffice, PDF;
              long ones in 256 KB parts
  list_files  see what is in the folder
  write_file  create or replace a file
  edit_file   change an exact piece of a file (asks first)
  web_fetch   read a web page by URL (asks first)
Tools that change something or reach out ask before each call, unless
ariadne was started with -trust for them; the card shows exactly what will
run. Files stay inside the conversation's folder.

Keys: Enter sends, Shift+Enter is a new line.
Every conversation is saved and can be reopened from the list; one that
was interrupted shows Resume.`;

function command(text) {
  const [name, ...rest] = text.slice(1).split(/\s+/);
  const arg = rest.join(' ');
  const say = msg => entry('notice', msg);
  switch (name.toLowerCase()) {
    case 'help': case '?':
      say(HELP); break;
    case 'new':
      newConversation(); break;
    case 'settings':
      openSetup(); break;
    case 'model':
      if (arg) { selectModel(arg); say('Next message uses ' + arg + '.'); }
      else say('Next message uses ' + (modelEl.value || 'the configured model') + '. /model <id> switches.');
      break;
    case 'folder':
      if (runID) say('This conversation reads and writes ' + (convWorkspace || 'the default folder') +
        '. A conversation keeps its folder; /new, then /folder, to choose another.');
      else $('folderBtn').onclick();
      break;
    case 'theme': {
      const pick = { system: 'auto', auto: 'auto', light: 'light', dark: 'dark' }[arg.toLowerCase()];
      if (arg && !pick) { say('/theme takes system, light or dark.'); break; }
      if (pick) setTheme(pick); else $('theme').click();
      say('Theme: ' + ({ auto: 'system', light: 'light', dark: 'dark' })[$('theme').dataset.theme] + '.');
      break;
    }
    case 'stop':
      if (turn) turn.abort(); else say('Nothing is running.');
      break;
    default:
      say('Unknown command /' + name + '. /help lists them; //' + name + ' sends it as a message.');
  }
}
$('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('composer').requestSubmit(); }
});
$('new').onclick = newConversation;
$('stop').onclick = () => { if (turn) turn.abort(); };

// ---- folder for a new conversation ----

function showFolder() {
  const f = (runID ? convWorkspace : newWorkspace) || defaultWorkspace;
  $('folder').textContent = f ? 'Folder: ' + f : '';
  $('folder').title = f ? f + ' — the folder this conversation can read and write' : '';
  $('folderBtn').hidden = !!runID;
}

function closeFolderPanel() {
  $('folderPanel').hidden = true;
  $('folderErr').textContent = '';
}

async function loadWorkspace() {
  try {
    const d = await (await api('/api/workspace')).json();
    defaultWorkspace = d.default || '';
    $('browse').hidden = !d.can_pick;
    showFolder();
  } catch (e) { warn('Could not read the default folder: ' + e.message); }
}

// Checked on the server before it is used, so a typo is reported now rather
// than after a message has been written.
async function useFolder(path) {
  $('folderErr').textContent = '';
  const resp = await api('/api/workspace/check', { method: 'POST', body: JSON.stringify({ path }) });
  const d = await resp.json().catch(() => ({ error: 'refused' }));
  if (!resp.ok) { $('folderErr').textContent = d.error; return; }
  newWorkspace = d.path;
  closeFolderPanel();
  showFolder();
  $('input').focus();
}

$('folderBtn').onclick = () => {
  if (busy || runID) return;
  $('folderInput').value = newWorkspace || defaultWorkspace;
  $('folderErr').textContent = '';
  $('folderPanel').hidden = false;
  $('folderInput').focus();
  $('folderInput').select();
};
$('cancelFolder').onclick = closeFolderPanel;
$('useFolder').onclick = () => useFolder($('folderInput').value);
$('folderInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); useFolder($('folderInput').value); }
  if (e.key === 'Escape') closeFolderPanel();
});

// The dialog opens on this computer, from the ariadne process: a browser never
// tells a page the real path of a folder.
$('browse').onclick = async () => {
  $('folderErr').textContent = '';
  $('browse').disabled = true;
  try {
    const resp = await api('/api/workspace/pick', { method: 'POST' });
    const d = await resp.json().catch(() => ({ error: 'refused' }));
    if (!resp.ok) { $('folderErr').textContent = d.error; return; }
    if (d.cancelled) return;
    $('folderInput').value = d.path;
    await useFolder(d.path);
  } finally {
    $('browse').disabled = false;
  }
};

// ---------------------------------------------------------------- setup
//
// The provider, key and model, from the page. The key goes to this computer's
// ariadne only, which checks it against the provider and stores it; the server
// never sends it back, so the field is always empty when the card opens.
let setup = null;

function setupChoice() {
  return (setup && setup.providers || []).find(p => p.id === $('setupProvider').value);
}

function showSetupFields() {
  const p = setupChoice();
  if (!p) return;
  $('setupURLRow').hidden = !(p.id === 'other' || p.id === 'ollama');
  if (p.id === 'ollama' && !$('setupURL').value) $('setupURL').value = p.base_url;
  $('setupKeyRow').hidden = !p.needs_key;
  $('setupKeyName').textContent = p.key_name ? '(' + p.key_name + ')' : '';
  const same = setup.configured && setup.provider === p.id;
  $('setupKey').placeholder = same && setup.key_set ? 'leave empty to keep the saved key' : '';
  $('setupModel').placeholder = p.default_model || (p.id === 'ollama' ? 'first model Ollama lists' : '');
  $('setupModels').replaceChildren();
  if (p.id === 'ollama') loadOllamaModels();
}

async function loadOllamaModels() {
  try {
    const resp = await api('/api/setup/ollama', { method: 'POST', body: JSON.stringify({ base_url: $('setupURL').value }) });
    const d = await resp.json();
    if (!resp.ok) { $('setupErr').textContent = d.error; return; }
    $('setupErr').textContent = '';
    $('setupModels').replaceChildren(...d.models.map(m => Object.assign(document.createElement('option'), { value: m })));
    if (!$('setupModel').value && d.models.length) $('setupModel').value = d.models[0];
  } catch (e) { $('setupErr').textContent = e.message; }
}

function openSetup() {
  if (!setup) return;
  $('setupProvider').replaceChildren(...setup.providers.map(p =>
    Object.assign(document.createElement('option'), { value: p.id, textContent: p.name })));
  $('setupProvider').value = setup.configured ? setup.provider : 'openrouter';
  $('setupURL').value = setup.configured && (setup.provider === 'other' || setup.provider === 'ollama') ? setup.base_url : '';
  $('setupKey').value = '';
  $('setupModel').value = setup.configured ? setup.model : '';
  $('setupErr').textContent = '';
  $('setupTitle').textContent = setup.configured ? 'Settings' : 'Choose a model provider';
  $('setupStatus').textContent = setup.configured
    ? `Using ${setup.base_url} with ${setup.model}` + (setup.key_set ? ' · key saved' : '')
    : 'ariadne needs a model provider before it can answer.';
  $('setupCancel').hidden = !setup.configured;
  $('setup').hidden = false;
  showSetupFields();
  ($('setupKeyRow').hidden ? $('setupModel') : $('setupKey')).focus();
}

function closeSetup() {
  $('setupKey').value = '';
  $('setup').hidden = true;
  $('input').focus();
}

function applySetupStatus(d) {
  setup = d;
  $('input').disabled = !d.configured;
  $('send').disabled = !d.configured || busy;
  for (const n of d.notes || []) warn(n);
}

async function loadSetup() {
  try {
    const resp = await api('/api/setup');
    if (!resp.ok) { $('settings').hidden = true; return; } // this server cannot be set up from here
    applySetupStatus(await resp.json());
    if (!setup.configured) openSetup();
  } catch (e) { warn('Could not read the setup: ' + e.message); }
}

$('settings').onclick = () => { if (!busy) (($('setup').hidden) ? openSetup() : closeSetup()); };
$('setupCancel').onclick = closeSetup;
$('setupProvider').onchange = () => { $('setupModel').value = ''; $('setupURL').value = ''; showSetupFields(); };
$('setupURL').onchange = () => { if (setupChoice() && setupChoice().id === 'ollama') loadOllamaModels(); };
$('setup').onsubmit = async e => {
  e.preventDefault();
  $('setupErr').textContent = '';
  $('setupSave').disabled = true;
  $('setupSave').textContent = 'Checking…';
  try {
    const resp = await api('/api/setup', { method: 'POST', body: JSON.stringify({
      provider: $('setupProvider').value, base_url: $('setupURL').value,
      key: $('setupKey').value, model: $('setupModel').value,
    }) });
    const d = await resp.json().catch(() => ({ error: 'refused' }));
    if (!resp.ok) { $('setupErr').textContent = d.error; return; }
    applySetupStatus(d);
    closeSetup();
    await loadModels(true);
  } catch (err) {
    $('setupErr').textContent = err.message;
  } finally {
    $('setupKey').value = '';
    $('setupSave').disabled = false;
    $('setupSave').textContent = 'Check and save';
  }
};

loadSetup();
loadModels();
loadRuns();
loadWorkspace();
$('input').focus();
</script>
